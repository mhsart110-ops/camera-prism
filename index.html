<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Camera Prism</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prism">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:sans-serif; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  #start {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#fff; z-index:10; cursor:pointer; font-size:1.2rem;
  }
  #hint {
    position:fixed; bottom:12px; width:100%; text-align:center; color:#fff8;
    font-size:.85rem; pointer-events:none;
  }
</style>
</head>
<body>
<div id="start">برای شروع دوربین را فعال کنید</div>
<div id="hint">با کشیدن انگشت، منشور را بچرخانید</div>
<video id="cam" autoplay playsinline muted style="display:none"></video>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
}
</script>
<script src="tesseract.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const video = document.getElementById('cam');
const startEl = document.getElementById('start');

// وجوه مکعب: هر وجه یک نوع اعوجاج شیشه‌ای دارد
// 0: شیشه‌ی صاف  1: وارونه  2: کوژ (Convex)  3: مقعر (Concave)  4: موج‌دار  5: چرخشی
const FACE_MODES = [2, 3, 0, 1, 4, 5];

// کادربندی مثل object-fit: cover، بدون آینه (دوربین همان‌طور که هست)
const cover = `
  uniform sampler2D tex;
  uniform vec2 res;
  uniform float vAspect;
  vec2 coverUV(vec2 s) {
    float r = res.x / res.y;
    vec2 u = s;
    if (r > vAspect) u.y = (s.y - 0.5) * (vAspect / r) + 0.5;
    else             u.x = (s.x - 0.5) * (r / vAspect) + 0.5;
    return u;
  }
`;

const vert = `
  varying vec2 vUv;
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    vUv = uv;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vN = normalize(normalMatrix * normal);
    vV = -mv.xyz;
    gl_Position = projectionMatrix * mv;
  }
`;

// هر وجه: ویدیوی پس‌زمینه را در مختصات صفحه نمونه‌برداری می‌کند و آن را شکست نور می‌دهد
const frag = cover + `
  precision highp float;
  uniform int mode;
  uniform float time;
  uniform float glow;
  varying vec2 vUv;
  varying vec3 vN;
  varying vec3 vV;

  void main() {
    vec2 p = vUv * 2.0 - 1.0;           // [-1,1] روی وجه
    float r2 = dot(p, p);
    vec2 d = vec2(0.0);                 // جابه‌جایی نوری بر حسب p

    if (mode == 1) {                    // وارونه
      d = -p * 0.10;
    } else if (mode == 2) {             // کوژ
      d = -p * r2 * 0.22;
    } else if (mode == 3) {             // مقعر
      d = p * r2 * 0.22;
    } else if (mode == 4) {             // موج‌دار
      d = vec2(0.02 * sin(p.y * 5.0 + time * 1.5), 0.07 * sin(p.x * 6.0 + time * 1.5));
    } else if (mode == 5) {             // چرخشی
      float a = 0.5 * r2;
      mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
      d = (R * p - p) * 0.25;
    }

    vec3 n = normalize(vN);
    vec3 v = normalize(vV);
    float ndv = clamp(dot(n, v), 0.0, 1.0);

    // مختصات صفحه + شکست نور وابسته به زاویه‌ی وجه
    vec2 s = gl_FragCoord.xy / res;
    vec2 base = s + d * 0.5 + (-n.xy) * 0.12;
    // پاشش رنگی (Chromatic aberration) در امتداد شعاعی
    vec2 ca = p * 0.008;
    float R = texture2D(tex, coverUV(base + ca)).r;
    float G = texture2D(tex, coverUV(base)).g;
    float B = texture2D(tex, coverUV(base - ca)).b;
    vec3 col = vec3(R, G, B);

    // رنگ شیشه کمی آبی-فیروزه‌ای
    col *= vec3(0.93, 0.98, 1.04);
    // لبه‌ی براق (Fresnel) و پخ لبه
    float fres = pow(1.0 - ndv, 3.0);
    col += vec3(0.55, 0.85, 1.0) * fres * 0.6;
    float edge = max(abs(p.x), abs(p.y));
    col = mix(col, vec3(1.0), smoothstep(0.86, 0.98, edge) * 0.35);
    col *= mix(0.8, 1.0, smoothstep(1.0, 0.8, edge));

    // درخشش وقتی آیه شناسایی شود
    // برق سطح شیشه
    float spec = pow(max(dot(reflect(-v, n), normalize(vec3(-0.4, 0.6, 0.7))), 0.0), 40.0);
    col += vec3(1.0) * spec * 0.35;

    // درخشش وقتی آیه شناسایی شود
    float pulse = 0.85 + 0.15 * sin(time * 4.0);
    vec3 light = vec3(0.35, 0.9, 1.0) * pulse;
    col = mix(col, col * 1.25 + light * 0.25, glow);
    col += light * glow * (0.35 * fres + 0.5 * smoothstep(0.7, 1.0, edge));
    gl_FragColor = vec4(col, 1.0);
  }
`;

// پس‌زمینه: دوربین تمام‌صفحه، بدون آینه
const bgVert = `
  void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
`;
const bgFrag = cover + `
  precision highp float;
  void main() {
    vec2 s = gl_FragCoord.xy / res;
    gl_FragColor = vec4(texture2D(tex, coverUV(s)).rgb, 1.0);
  }
`;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const bgScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.z = 4.2;

const resV = new THREE.Vector2(1, 1);
const clock = new THREE.Clock();
const materials = [];
let videoTex = null;

const bgMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, res: { value: resV }, vAspect: { value: 1 } },
  vertexShader: bgVert,
  fragmentShader: bgFrag,
  depthTest: false,
  depthWrite: false,
});
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgMesh.frustumCulled = false;
bgScene.add(bgMesh);

function buildCube() {
  const geo = new THREE.BoxGeometry(2, 2, 2);
  // هر وجه یک گروپ جدا و متریال جداگانه دارد
  const mats = FACE_MODES.map(mode => {
    const m = new THREE.ShaderMaterial({
      uniforms: {
        tex: { value: null },
        res: { value: resV },
        vAspect: { value: 1 },
        mode: { value: mode },
        time: { value: 0 },
        glow: { value: 0 },
      },
      vertexShader: vert,
      fragmentShader: frag,
    });
    materials.push(m);
    return m;
  });
  const mesh = new THREE.Mesh(geo, mats);
  scene.add(mesh);
  return mesh;
}

const cube = buildCube();
cube.rotation.set(0.5, 0.6, 0);
cube.scale.setScalar(0.42);   // منشور کوچک وسط صفحه

// چرخش با انگشت / ماوس
let dragging = false, lx = 0, ly = 0, vx = 0.002, vy = 0.003;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  vy = dx * 0.005; vx = dy * 0.005;
  cube.rotation.y += vy; cube.rotation.x += vx;
});

function updateSize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.getDrawingBufferSize(resV);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', updateSize);
updateSize();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (!dragging) {
    cube.rotation.y += vy * 0.98 + 0.002;
    cube.rotation.x += vx * 0.98;
    vx *= 0.98; vy *= 0.98;
  }
  glowCur += (glowTarget - glowCur) * 0.04;
  const va = video.videoWidth ? video.videoWidth / video.videoHeight : 1;
  materials.forEach(m => { m.uniforms.time.value = t; m.uniforms.glow.value = glowCur; });
  [bgMat, ...materials].forEach(m => {
    m.uniforms.tex.value = videoTex;
    m.uniforms.vAspect.value = va;
  });
  renderer.clear();
  renderer.render(bgScene, camera);   // اول پس‌زمینه
  renderer.render(scene, camera);     // بعد منشور روی آن
}

// ---- تشخیص آیه (OCR فارسی/عربی در مرورگر) ----
const KEYS = ['الفيل', 'اصحاب', 'ربك', 'كيف', 'فعل', 'تر'];
let worker = null, scanning = false, glowTarget = 0, glowCur = 0, glowTimer = null;
const statusEl = document.createElement('div');
statusEl.style.cssText = 'position:fixed;top:12px;width:100%;text-align:center;color:#fff;font-size:.95rem;pointer-events:none;text-shadow:0 0 6px #000;z-index:5';
document.body.appendChild(statusEl);
const dbg = document.createElement('div');
dbg.style.cssText='position:fixed;bottom:60px;width:100%;text-align:center;color:#9fd;font-size:.8rem;direction:rtl;pointer-events:none;text-shadow:0 0 4px #000;z-index:5';
document.body.appendChild(dbg);
const ocrCanvas = document.createElement('canvas');
const octx = ocrCanvas.getContext('2d', { willReadFrequently: true });

// یکسان‌سازی متن: حذف اعراب، یکسان کردن شکل حروف عربی و فارسی
function normalize(s) {
  return s
    .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
    .replace(/[إأآٱ]/g, 'ا')
    .replace(/[ىی]/g, 'ي')
    .replace(/ک/g, 'ك')
    .replace(/ة/g, 'ه')
    .replace(/[ؤ]/g, 'و')
    .replace(/[ئ]/g, 'ي');
}

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const TARGET = normalize('الم تر كيف فعل ربك باصحاب الفيل').replace(/\s+/g,'');
const STRONG = ['كيف','فعل','ربك','باصحاب','الفيل'];
const WEAK = ['الم','تر'];
let history = [];
function wordHits(text) {
  const t = normalize(text).replace(/[^\u0600-\u06FF\s]/g,' ');
  const flat = t.replace(/\s+/g,'');
  const toks = t.split(/\s+/).filter(Boolean);
  const hit = w => {
    if (w.length >= 4 && flat.includes(w)) return true;
    return toks.some(k => k === w || (w.length >= 3 && Math.abs(k.length-w.length) <= 1 && lev(k,w) <= 1) || (w.length >= 4 && k.length > w.length && lev(k.slice(0,w.length+1),w) <= 1));
  };
  const s = new Set();
  STRONG.forEach(w => { if (hit(w)) s.add(w); });
  WEAK.forEach(w => { if (toks.includes(w)) s.add(w); });
  let sim = 0;
  const win = TARGET.length;
  for (let i = 0; i + win*0.7 <= flat.length; i += 2) {
    sim = Math.max(sim, 1 - lev(flat.slice(i, i + win), TARGET)/win);
  }
  return { s, sim };
}
function isMatch(text) {
  const { s, sim } = wordHits(text);
  const strongN = STRONG.filter(w => s.has(w)).length;
  // انباشتن نتیجه چند اسکن پشت‌سرهم (هر اسکن بخشی از آیه را درست می‌خواند)
  history.push(s); if (history.length > 5) history.shift();
  if (strongN >= 3 || sim >= 0.6) return true;
  const u = new Set(); history.forEach(h => h.forEach(w => u.add(w)));
  const uStrong = STRONG.filter(w => u.has(w)).length;
  const uWeak = WEAK.filter(w => u.has(w)).length;
  return uStrong >= 4 || (uStrong >= 3 && uWeak >= 1);
}

function triggerGlow() {
  glowTarget = 1;
  statusEl.textContent = 'منشور درخشید ✨ آیه شناسایی شد';
  clearTimeout(glowTimer);
  glowTimer = setTimeout(() => {
    glowTarget = 0;
    statusEl.textContent = 'آیه را روبه‌روی دوربین بگیرید';
  }, 6000);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const vb = document.createElement('button');
  vb.textContent = '🎤 تشخیص صدا';
  vb.style.cssText = 'position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;padding:10px 18px;border-radius:20px;border:0;background:#1e6;font-size:1rem';
  document.body.appendChild(vb);
  vb.onclick = () => {
    const r = new SR(); r.lang = 'ar-SA'; r.continuous = true; r.interimResults = true;
    r.onresult = e => { const t = Array.from(e.results).map(x => x[0].transcript).join(' '); dbg.textContent = t.slice(-160); if (isMatch(t)) triggerGlow(); };
    r.onend = () => { try { r.start(); } catch (_) {} };
    r.start(); vb.textContent = '🎤 در حال گوش دادن...';
  };
}

async function startDetector() {
  statusEl.textContent = 'در حال آماده‌سازی تشخیص متن...';
  try {
    const base = new URL('./', location.href).href;
    const need = ['worker.min.js', 'tesseract-core-simd-lstm.wasm.js', 'tesseract-core-lstm.wasm.js', 'ara.traineddata.gz'];
    const missing = [];
    for (const f of need) {
      try { const r = await fetch(base + f, { cache: 'no-store' }); if (!r.ok) missing.push(f + ' (' + r.status + ')'); }
      catch (_) { missing.push(f); }
    }
    if (missing.length) throw new Error('فایل ناموجود روی سایت: ' + missing.join(' ، '));
    worker = await Tesseract.createWorker('ara', 1, {
      workerPath: base + 'worker.min.js',
      corePath: base,
      langPath: base,
      gzip: true,
      cacheMethod: 'none',
      logger: m => { if (m && m.status) statusEl.textContent = 'آماده‌سازی: ' + m.status; }
    });
    statusEl.textContent = 'آیه را روبه‌روی دوربین بگیرید';
    setInterval(scan, 1500);
  } catch (e) {
    statusEl.textContent = 'تشخیص متن در دسترس نیست: ' + (e && (e.message || e) || 'خطای نامشخص');
  }
}

// دودویی‌سازی تطبیقی (روشنایی ناهمگون) با تصویر انتگرالی؛ برای خط عثمانی بسیار مؤثر است
function binarize(cv, c) {
  const w = cv.width, h = cv.height;
  const img = octx.getImageData(0, 0, w, h), d = img.data;
  const g = new Uint8ClampedArray(w*h);
  for (let i = 0, j = 0; j < g.length; i += 4, j++) g[j] = d[i];
  const W1 = w + 1, I = new Float64Array(W1 * (h + 1));
  for (let y = 1; y <= h; y++) {
    let row = 0;
    for (let x = 1; x <= w; x++) { row += g[(y-1)*w + x-1]; I[y*W1+x] = I[(y-1)*W1+x] + row; }
  }
  const r = Math.max(8, Math.round(w / 40));
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y-r), y1 = Math.min(h, y+r+1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x-r), x1 = Math.min(w, x+r+1);
      const sum = I[y1*W1+x1] - I[y0*W1+x1] - I[y1*W1+x0] + I[y0*W1+x0];
      const mean = sum / ((x1-x0)*(y1-y0));
      const v = g[y*w+x] < mean - c ? 0 : 255;
      const k = (y*w+x)*4; d[k] = d[k+1] = d[k+2] = v; d[k+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
}

const SCALES = [1800, 1300, 1000];
let scanNo = 0;
async function scan() {
  if (scanning || !worker || video.readyState < 2) return;
  scanning = true;
  try {
    const w = SCALES[scanNo++ % SCALES.length];
    const h = Math.round(video.videoHeight * w / video.videoWidth);
    ocrCanvas.width = w;
    ocrCanvas.height = h;
    octx.filter = 'grayscale(1) blur(' + (w / 1400).toFixed(2) + 'px)';
    octx.drawImage(video, 0, 0, w, h);
    octx.filter = 'none';
    binarize(ocrCanvas, 10);
    const { data } = await worker.recognize(ocrCanvas);
    dbg.textContent = (data.text||'').trim().slice(0,160);
    if (isMatch(data.text)) triggerGlow();
  } catch (e) {
    // خطای یک فریم را نادیده می‌گیریم
  }
  scanning = false;
}

startEl.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    videoTex = new THREE.VideoTexture(video);
    startEl.remove();
    animate();
    startDetector();
  } catch (err) {
    startEl.textContent = 'دسترسی به دوربین ممکن نیست: ' + err.message;
  }
});
</script>
</body>
